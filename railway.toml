# https://docs.railway.com/guides/config-as-code
[build]
builder = "nixpacks"

[deploy]
# Gọi Node trực tiếp — tránh npm bọc ngoài (log SIGTERM dễ hiểu hơn)
startCommand = "NODE_ENV=production node dist/server/index.js"
healthcheckPath = "/api/health"
# Mongo + cold start: tránh SIGTERM khi healthcheck quá sớm
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
